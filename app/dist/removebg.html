<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Background Remover</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="removebg.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="imgops.js"></script><script src="compare.js"></script>
</head>
<body>
<main class="work">
  <section class="monitor" data-i18n-aria-label="rb.image">
    <div class="bar" id="topbar" hidden>
      <div class="tabs modes" role="radiogroup" id="modes" data-i18n-aria-label="rb.mode">
        <button class="tab" role="radio" data-mode="auto" aria-checked="true" data-i18n-title="rb.mode.autoTip"><span data-icon="sparkles"></span><span data-i18n="rb.mode.auto"></span></button>
        <button class="tab" role="radio" data-mode="wand" aria-checked="false" data-i18n-title="rb.mode.wandTip"><span data-icon="wand-sparkles"></span><span data-i18n="rb.mode.wand"></span></button>
        <button class="tab" role="radio" data-mode="brush" aria-checked="false" data-i18n-title="rb.mode.brushTip"><span data-icon="paintbrush"></span><span data-i18n="rb.mode.brush"></span></button>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" id="undoBtn" data-icon="undo-2" data-i18n-title="rb.undo" data-i18n-aria-label="rb.undo" disabled></button>
      <button class="btn ghost icon" id="redoBtn" data-icon="redo-2" data-i18n-title="rb.redo" data-i18n-aria-label="rb.redo" disabled></button>
      <button class="btn ghost" id="holdBtn" data-icon="eye" data-i18n-title="rb.holdTip"><span data-i18n="rb.hold"></span></button>
      <button class="btn ghost" id="maskBtn" data-icon="square-dashed" aria-pressed="false" data-i18n-title="rb.maskTip"><span data-i18n="rb.mask"></span></button>
    </div>
    <div class="bezel"><div class="stage" id="stage" data-bg="checker" data-mode="auto">
      <div class="cmp" id="cmp" hidden>
        <div class="layer before"><img id="before" alt="" draggable="false"></div>
        <div class="layer after"><div class="matte" id="matte"></div><canvas id="view"></canvas><canvas id="over" class="over"></canvas></div>
        <span class="lbl b" id="beforeTag" data-i18n="up.before" hidden></span>
        <span class="zoom" id="zoom"></span>
      </div>
      <span class="ring" id="ring" hidden></span>
      <div class="busy skel" id="busy" hidden><div class="busynote"><span id="busyText"></span><div class="prog indet"><i id="busyBar"></i></div></div></div>
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
        <span class="big" data-icon="wand-sparkles"></span>
        <b data-i18n="rb.empty.title"></b>
        <p data-i18n="rb.empty.note"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button></div>
      </div>
    </div></div>
    <div class="info" id="inputInfo" hidden><img id="inThumb" alt=""><div><b id="inName"></b><span id="inSize"></span></div><span class="spacer"></span><button class="btn sm" id="changeBtn"><span data-i18n="up.change"></span></button></div>
    <input type="file" id="imgIn" accept="image/png,image/jpeg,image/webp" hidden>
  </section>

  <aside class="rack">
    <section class="card tool" id="toolCard">
      <div class="card-h"><h2 id="toolTitle"></h2></div>
      <p class="note" id="toolNote"></p>
      <ul class="how" id="howRow" hidden><li class="fg"><span id="howFg"></span></li><li class="bg"><span id="howBg"></span></li></ul>
      <div class="row" id="autoRow"><button class="btn" id="detectBtn" data-icon="sparkles"><span data-i18n="rb.detect"></span></button></div>
      <div class="brushopts" id="brushRow" hidden>
        <div class="tabs" role="radiogroup" id="brushTools" data-i18n-aria-label="rb.brushTool">
          <button class="tab" role="radio" data-btool="fg" aria-checked="true" data-i18n-title="rb.fgTip"><span data-icon="focus"></span><span data-i18n="rb.fg"></span></button>
          <button class="tab" role="radio" data-btool="bg" aria-checked="false" data-i18n-title="rb.bgTip"><span data-icon="eraser"></span><span data-i18n="rb.bg"></span></button>
        </div>
        <div class="f"><div class="fl"><label for="size" data-i18n="rb.size"></label><output id="oSize"></output></div><input type="range" data-def="60" id="size" min="2" max="400" step="1" value="60"></div>
      </div>
    </section>

    <section class="card opts" id="optsCard">
      <div class="f"><div class="fl"><label for="intensity" data-i18n="rb.intensity" data-scrub></label><output id="oIntensity"></output></div><input type="range" data-def="50" id="intensity" min="0" max="100" step="1" value="50" data-i18n-title="common.dblReset"></div>
      <div class="f"><div class="fl"><label for="threshold" data-i18n="rb.threshold" data-scrub></label><output id="oThreshold"></output></div><input type="range" data-def="50" id="threshold" min="0" max="100" step="1" value="50" data-i18n-title="common.dblReset"></div>
      <div class="f"><div class="fl"><label for="feather" data-i18n="rb.feather" data-scrub></label><output id="oFeather"></output></div><input type="range" data-def="1" id="feather" min="0" max="20" step="0.5" value="1" data-i18n-title="common.dblReset"></div>
      <div class="f"><div class="fl"><label for="shift" data-i18n="rb.shift" data-scrub></label><output id="oShift"></output></div><input type="range" data-def="0" id="shift" min="-20" max="20" step="0.5" value="0" data-i18n-title="common.dblReset"></div>
      <div class="f"><div class="fl"><label for="clean" data-i18n="rb.clean" data-scrub></label><output id="oClean"></output></div><input type="range" data-def="50" id="clean" min="0" max="100" step="1" value="50" data-i18n-title="common.dblReset"></div>
      <div class="f"><div class="fl"><label for="islands" data-i18n="rb.islands" data-scrub></label><output id="oIslands"></output></div><input type="range" data-def="0.2" id="islands" min="0" max="2" step="0.05" value="0.2" data-i18n-title="common.dblReset"></div>
      <div class="btnrow"><button class="btn primary" id="applyBtn" data-icon="check" disabled><span data-i18n="rb.remove"></span></button><button class="btn ghost" id="clearSel" data-icon="x" disabled><span data-i18n="rb.clearSel"></span></button></div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="card view">
      <span class="lbl note" data-i18n="cut.bg"></span>
      <div class="bgs" role="group" id="bgs" data-i18n-aria-label="cut.bg">
        <button data-bg="checker" aria-pressed="true" data-i18n-title="cut.bg.checker" data-i18n-aria-label="cut.bg.checker"></button><button data-bg="black" aria-pressed="false" data-i18n-title="cut.bg.black" data-i18n-aria-label="cut.bg.black"></button><button data-bg="white" aria-pressed="false" data-i18n-title="cut.bg.white" data-i18n-aria-label="cut.bg.white"></button><input type="color" id="bgColor" data-i18n-title="cut.bg.color" data-i18n-aria-label="cut.bg.color">
      </div>
    </section>

    <section class="card" id="exportCard">
      <div class="card-h"><h2 data-i18n="rb.export"></h2></div>
      <div class="tabs" role="radiogroup" id="formats" data-i18n-aria-label="up.format">
        <button class="tab" role="radio" data-format="png" aria-checked="true">PNG</button>
        <button class="tab" role="radio" data-format="webp" aria-checked="false">WebP</button>
        <button class="tab" role="radio" data-format="mask" aria-checked="false" data-i18n="rb.maskOnly"></button>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="saveBtn" data-icon="save" disabled><span data-i18n="rb.save"></span></button>
        <button class="btn" id="cropBtn" data-icon="crop" disabled data-i18n-title="rb.cropTip"><span data-i18n="up.crop"></span></button>
        <button class="btn" id="sendBtn" data-icon="send" disabled data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
      </div>
      <p class="hint" data-i18n="rb.hint"></p>
    </section>
  </aside>
</main>

<script src="removebg.js"></script>
</body></html>
