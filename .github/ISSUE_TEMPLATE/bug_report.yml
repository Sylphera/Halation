name: Bug report
description: Something in Halation does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Halation version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and GPU
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
