<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover Test</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="covertest.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="imgops.js"></script>
</head>
<body>
<main class="work">
  <aside class="rack left">
    <div class="ltabs left-tabs" id="leftTabs" role="tablist">
      <button class="ltab" id="coverTab" role="tab" aria-selected="true" data-left-tab="cover" aria-controls="coverPanel"><span data-i18n="ct.coverSection"></span></button>
      <button class="ltab" id="referencesTab" role="tab" aria-selected="false" data-left-tab="references" aria-controls="referencesPanel"><span data-i18n="ct.profiles"></span></button>
    </div>
    <div class="rack-scroll" id="leftContent">
    <section class="rack-section" id="coverPanel" role="tabpanel" aria-labelledby="coverTab">
    <section class="card" id="coversCard">
      <div class="card-h"><h2 data-i18n="ct.covers"></h2><span class="n" id="coverCount"></span></div>
      <div class="covers" id="covers" role="radiogroup" data-i18n-aria-label="ct.covers"></div>
      <p class="hint" id="coversHint" data-i18n="ct.coversHint"></p>
      <input type="file" id="imgIn" accept="image/png,image/jpeg,image/webp" hidden>
    </section>

    </section>
    <section class="rack-section" id="referencesPanel" role="tabpanel" aria-labelledby="referencesTab" hidden>
    <section class="card" id="profileCard">
      <div class="card-h"><h2 data-i18n="ct.profile"></h2><span class="n" id="profAge"></span></div>
      <div class="prof" id="prof"></div>
      <form class="profile-search" id="profileSearch">
        <label for="profileName" data-i18n="ct.profileName"></label>
        <div class="btnrow"><input id="profileName" type="search" autocomplete="off" data-i18n-placeholder="ct.profileNamePlaceholder"><button class="btn sm" id="profileSearchBtn" type="submit" data-icon="search"><span data-i18n="ct.profileSearch"></span></button></div>
      </form>
      <p class="status" id="profileSearchStatus" role="status"></p>
      <div class="profile-candidates" id="profileCandidates" aria-busy="false"></div>
      <div class="btnrow">
        <button class="btn sm" id="refreshBtn" data-icon="refresh-cw"><span data-i18n="ct.update"></span></button>
        <button class="btn ghost sm" id="removeArtistBtn" hidden><span data-i18n="ct.removeArtist"></span></button>
      </div>
      <p class="status" id="profStatus" role="status"></p>
    </section>


    <section class="card" id="refsCard">
      <div class="card-h"><h2 data-i18n="ct.referenceArtists"></h2><span class="n" id="refCount"></span></div>
      <p class="note" data-i18n="ct.refsNote"></p>
      <div class="refs" id="refs"></div>
      <form class="refadd" id="refForm" autocomplete="off"><input type="text" id="refIn" maxlength="200" spellcheck="false" data-i18n-placeholder="ct.refPh"><button class="btn sm" id="refAdd" type="submit" data-icon="plus"><span data-i18n="ct.refAdd"></span></button></form>
      <p class="status" id="refStatus" role="status"></p>
    </section>
    <section class="card" id="feedCard">
      <div class="card-h"><h2 data-i18n="ct.feed"></h2><span class="n" id="feedAge"></span></div>
      <p class="note" id="feedWhat"></p>
      <label class="f" id="queryRow"><span data-i18n="ct.query"></span><input type="text" id="fQuery" maxlength="80" spellcheck="false"></label>
      <div class="btnrow"><button class="btn sm" id="feedBtn" data-icon="refresh-cw"><span data-i18n="ct.refreshFeed"></span></button><button class="btn ghost sm" id="cancelSearchBtn" data-icon="x" hidden><span data-i18n="ct.cancelSearchTest"></span></button></div>
    </section>
    </section>
    </div>
  </aside>

  <section class="monitor" data-i18n-aria-label="ct.preview">
    <div class="bar">
      <div class="tabs plats" role="radiogroup" id="plats" data-i18n-aria-label="ct.platform">
        <button class="tab" role="radio" data-plat="youtube" aria-checked="true">YouTube</button>
        <button class="tab" role="radio" data-plat="spotify" aria-checked="false">Spotify</button>
        <button class="tab" role="radio" data-plat="soundcloud" aria-checked="false">SoundCloud</button>
      </div>
      <div class="tabs views" role="radiogroup" id="views" data-i18n-aria-label="ct.view"></div>
      <span class="spacer"></span>
      <button class="btn ghost icon" id="themeBtn" data-icon="sun-moon" data-i18n-title="ct.theme" data-i18n-aria-label="ct.theme" aria-pressed="false"></button>
      <button class="btn ghost" id="farBtn" data-icon="eye" aria-pressed="false" data-i18n-title="ct.farTip"><span data-i18n="ct.far"></span></button>
      <button class="btn ghost icon" id="maximizePreviewBtn" data-icon="maximize" aria-pressed="false" data-i18n-title="ct.maximizePreview" data-i18n-aria-label="ct.maximizePreview"></button>
    </div>
    <div class="stage" id="stage">
      <div class="scroller" id="scroller"><div class="farbox" id="farbox"><div class="chrome" id="chrome" hidden></div><div class="bview" id="bview"><div class="pf" id="page"></div></div></div></div>
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0" hidden>
        <span class="big" data-icon="image-plus"></span>
        <b data-i18n="ct.upload"></b>
        <p data-i18n="ct.uploadNote"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="libBtn" data-icon="library"><span data-i18n="ct.fromLibrary"></span></button></div>
      </div>
    </div>
    <p class="hint feednote" id="feedNote"></p>
  </section>

  <aside class="rack right">
    <section class="card" id="dataCard">
      <div class="card-h"><h2 data-i18n="ct.data"></h2></div>
      <label class="f"><span data-i18n="ct.title"></span><input type="text" id="fTitle" maxlength="120" spellcheck="false"></label>
      <label class="f"><span data-i18n="ct.artist"></span><input type="text" id="fArtist" maxlength="80" spellcheck="false"></label>
      <label class="tog" id="youtubeArtistInTitleRow" for="youtubeArtistInTitle"><span data-i18n="ct.artistInTitle"></span><input type="checkbox" role="switch" id="youtubeArtistInTitle"></label>
      <div class="grid2">
        <label class="f"><span data-i18n="ct.views"></span><input type="text" id="fViews" maxlength="16" spellcheck="false"></label>
        <label class="f"><span data-i18n="ct.duration"></span><input type="text" id="fDuration" maxlength="8" spellcheck="false"></label>
      </div>
      <label class="f"><span data-i18n="ct.date"></span><input type="text" id="fDate" maxlength="40" spellcheck="false"></label>
      <label class="f"><span data-i18n="ct.position"></span><select id="fPos"></select></label>
    </section>

    <section class="card" id="exportCard">
      <div class="card-h"><h2 data-i18n="ct.export"></h2></div>
      <div class="tabs" role="radiogroup" id="scales" data-i18n-aria-label="ct.scale">
        <button class="tab" role="radio" data-scale="1" aria-checked="true">1×</button>
        <button class="tab" role="radio" data-scale="2" aria-checked="false">2×</button>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="saveBtn" data-icon="save" disabled><span data-i18n="ct.savePng"></span></button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
  </aside>
</main>

<script type="module" src="covertest.js"></script>
</body></html>
