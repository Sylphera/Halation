[package]
name = "halation"
version = "1.2.1"
description = "Halation: high-quality local multimedia workspace"
authors = ["Sylphera"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Sylphera/Halation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
fontdb = "0.24"
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Converter (convert.rs): image formats in Rust; WebP with loss through libwebp
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico", "tga", "qoi"] }
webp = { version = "0.3", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
# Converter v2: PDF pages through PDFium (a downloaded library, loaded at run time); its tgz unpacked here
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Vocal Remover (stems.rs): ONNX Runtime loaded at run time from Tools\stems (API of onnxruntime 1.24), the STFT, sha256
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
rustfft = "6"
sha2 = "0.10"
tauri-plugin-updater = "~2.10"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
tauri-winrt-notification = "0.8"
winreg = "0.56"
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Halation Preview (docs/PREVIEW.md): identifier com.halation.preview, its own data folders, no single instance.
# Built with tauri.preview.conf.json by app/scripts/halation-preview.cjs --build; never in a release.
preview = []
