<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocal Remover</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="stems.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script>
</head>
<body>
<main class="work">
  <!-- Songs (each opens in the mixer) with a place to drop more · the mixer: the song, its lanes, the player, the model
       and Separate / All · Export and the legal notes -->
  <aside class="win queue" data-i18n-aria-label="st.songs">
    <div class="win-h"><h2 data-i18n="st.songs"></h2><span class="n" id="qCount"></span></div>
    <div class="win-b">
      <ul class="qlist" id="queue" role="tablist" data-i18n-aria-label="st.songs"></ul>
      <p class="note" id="qEmpty" data-i18n="st.qEmpty"></p>
    </div>
    <div class="dropmore" id="dropMore" role="button" tabindex="0">
      <span class="big" data-icon="upload"></span>
      <b data-i18n="st.dropMore"></b>
      <small id="dropNote"></small>
      <div class="btnrow"><button class="btn sm" id="addBtn" data-icon="plus"><span data-i18n="st.add"></span></button><button class="btn ghost sm" id="libBtn" data-icon="library"><span data-i18n="st.fromLibrary"></span></button></div>
    </div>
  </aside>

  <section class="win mixer" data-i18n-aria-label="st.song">
    <div class="win-h info">
      <span class="ico" data-icon="music"></span>
      <div class="nm"><b id="songName" data-i18n="st.noSong"></b><span id="songMeta"></span></div>
      <p class="status mono" id="status" role="status"></p>
    </div>
    <div class="stage">
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
        <span class="big" data-icon="mic-vocal"></span>
        <b data-i18n="st.empty.title"></b>
        <p data-i18n="st.empty.note"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="linkBtn" data-icon="link"><span data-i18n="common.downloadLink"></span></button></div>
      </div>
      <div class="song" id="song" hidden>
        <!-- one lane per track of the song's mode (stems.js buildLanes) -->
        <div class="lanes" id="lanes"></div>
        <div class="facts"><dl class="stats" id="stats"></dl><p class="note" id="songNote" hidden></p></div>
      </div>
    </div>
    <!-- the player: play, position, time, and what it plays (Original / Separated) -->
    <div class="transport">
      <button class="btn icon" id="playBtn" data-icon="play" data-i18n-title="st.play" disabled></button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" data-i18n-aria-label="st.position" disabled>
      <output class="mono" id="time">0:00</output>
      <div class="tabs ab" role="radiogroup" id="ab" data-i18n-aria-label="st.previewMix">
        <button class="tab" role="radio" data-ab="orig" aria-checked="false" data-i18n="st.ab.orig"></button>
        <button class="tab" role="radio" data-ab="sep" aria-checked="true" data-i18n="st.ab.sep"></button>
      </div>
    </div>
    <!-- the model (2 stems, fast; 4 stems, the cleaner vocals, slower), then Separate (this song) and All -->
    <div class="setup">
      <div class="modes" role="radiogroup" id="modes" data-i18n-aria-label="st.mode">
        <button class="mopt" role="radio" data-mode="hq4" aria-checked="true"><span class="mhead"><b data-i18n="st.m.hq4"></b><em class="mtag" data-i18n="st.tag.hq4"></em></span><span class="chips"></span><small class="mono"></small></button>
        <button class="mopt" role="radio" data-mode="htdemucs" aria-checked="false"><span class="mhead"><b data-i18n="st.m.htdemucs"></b><em class="mtag" data-i18n="st.tag.htdemucs"></em></span><span class="chips"></span><small class="mono"></small></button>
      </div>
      <div class="engine" id="engine" hidden>
        <span class="badge-warn" data-i18n="st.missing"></span>
        <p class="note" id="engineNote"></p>
        <button class="btn primary sm" id="installBtn" data-icon="hard-drive-download"><span data-i18n="st.install"></span></button>
        <div class="prog" id="installProg" hidden><i id="installBar"></i></div>
        <p class="status" id="installStatus"></p>
      </div>
      <div class="runrow">
        <button class="btn primary" id="sepBtn" data-icon="mic-vocal" disabled><span data-i18n="st.sepOne"></span></button>
        <button class="btn" id="runBtn" data-icon="layers" disabled><span data-i18n="st.run"></span></button>
        <button class="btn ghost" id="cancelBtn" hidden><span data-i18n="common.cancel"></span></button>
      </div>
    </div>
  </section>

  <aside class="win export">
    <div class="win-h"><h2 data-i18n="st.export"></h2></div>
    <div class="win-b">
      <label class="f"><span data-i18n="st.format"></span><select id="format"><option value="wav" data-i18n="st.f.wav"></option><option value="flac" data-i18n="st.f.flac"></option><option value="mp3" data-i18n="st.f.mp3"></option></select></label>
      <label class="f"><span data-i18n="st.rate"></span><select id="rate"><option value="44100" data-i18n="st.r.44100"></option><option value="source" data-i18n="st.r.source"></option></select></label>
      <button class="btn sm ghost" id="destSettings" data-i18n="save.setting"></button>
      <div class="f"><span data-i18n="st.exportWhat"></span>
        <div class="outs" id="outs">
          <div class="olist" id="olist"></div>
          <label class="tog" for="mixOut"><span data-i18n="st.mixOut"></span><input type="checkbox" id="mixOut" data-out="mix"></label>
          <button class="btn primary" id="exportBtn" data-icon="download" disabled><span data-i18n="st.exportAll"></span></button>
        </div>
      </div>
      <label class="tog" for="autoExport"><span data-i18n="st.auto"></span><input type="checkbox" id="autoExport" checked></label>
      <div class="btnrow">
        <button class="btn sm" id="sendBtn" data-icon="send" data-i18n-title="send.tip" disabled><span data-i18n="send.to"></span></button>
        <button class="btn ghost sm" id="reveal" data-icon="folder-open" hidden><span data-i18n="common.reveal"></span></button>
      </div>
      <p class="status" id="exportStatus" role="status"></p>
    </div>
    <div class="win-f legalbox">
      <p class="note credit" id="modeNote"></p>
      <p class="note runs" id="runsOn"></p>
      <p class="note legal" data-i18n="st.legal"></p>
    </div>
  </aside>
</main>
<input type="file" id="fileIn" accept="audio/*,video/*,.mp3,.wav,.flac,.m4a,.ogg,.opus,.mp4,.mov,.mkv,.webm" multiple hidden>
<script src="stems.js"></script>
</body></html>
