[package]
name = "halation-slint"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Halation native beta: Rust + Slint + Skia clean-room shell"
publish = false
build = "build.rs"

[lib]
name = "halation_slint"
path = "src/lib.rs"

[[bin]]
name = "halation-slint"
path = "src/main.rs"

[dependencies]
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
# Diagnostic renderer comparison only; the shipping beta uses winit + Skia.
diag-femtovg = ["slint/renderer-femtovg"]
diag-software = ["slint/renderer-software"]
diag-skia-opengl = ["slint/renderer-skia-opengl"]
diag-skia-vulkan = ["slint/renderer-skia-vulkan"]

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[profile.release]
strip = "debuginfo"
