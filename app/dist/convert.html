<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converter</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="convert.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script>
</head>
<body>
<main class="work">
  <section class="start" id="empty">
    <div class="emptyzone" id="drop" role="button" tabindex="0">
      <span class="big" data-icon="repeat"></span>
      <b data-i18n="cv.empty.title"></b>
      <p data-i18n="cv.empty.note"></p>
      <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="cv.browseFiles"></span></button><button class="btn" id="folderBtn" data-icon="folder-open"><span data-i18n="cv.browseFolder"></span></button></div>
    </div>
    <div class="kinds" id="kinds"></div>
  </section>

  <section class="stage" id="stage" hidden>
    <div class="card left">
      <div class="preview" id="preview"></div>
      <div class="batch" id="batch" hidden>
        <div class="card-h"><h2 id="batchTitle"></h2><div class="btnrow"><button class="btn sm" id="addBtn" data-icon="plus"><span data-i18n="cv.add"></span></button><button class="btn sm ghost" id="clearBtn"><span data-i18n="cv.clear"></span></button></div></div>
        <div id="groups"></div>
      </div>
    </div>

    <aside class="card side" id="side">
      <div class="head">
        <div class="thumb" id="thumb"></div>
        <div class="meta"><b id="oneName"></b><span id="oneType"></span></div>
        <button class="btn sm" id="changeBtn"><span data-i18n="cv.change"></span></button>
      </div>
      <p class="note cant" id="cant" hidden data-i18n="cv.cant"></p>
      <div id="choices"></div>
      <div class="f pick"><button class="btn sm ghost" id="destSettings" data-i18n="save.setting"></button></div>
      <div class="need" id="need" hidden>
        <p class="note" id="needNote"></p>
        <button class="btn" id="installBtn" data-icon="hard-drive-download"><span data-i18n="cv.install"></span></button>
        <div class="prog" id="installProg" hidden><i id="installBar"></i></div>
      </div>
      <div class="go">
        <button class="btn primary wide" id="convertBtn" disabled><span class="fill" aria-hidden="true"><i id="bar"></i></span><span class="lbl" data-icon="repeat"><span id="convertLabel" data-i18n="cv.convert"></span></span></button>
        <button class="btn" id="cancelBtn" hidden><span data-i18n="common.cancel"></span></button>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="done" id="done" hidden>
        <span class="sizes mono" id="sizes"></span>
        <span class="spacer"></span>
        <button class="btn sm" id="sendBtn" data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
        <button class="btn sm ghost" id="revealBtn" data-icon="folder-open"><span data-i18n="cv.openFolder"></span></button>
      </div>
    </aside>
  </section>
  <input type="file" id="fileIn" multiple hidden>
</main>
<script src="convert.js"></script>
</body></html>
