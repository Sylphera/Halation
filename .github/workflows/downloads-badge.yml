name: Downloads badge

# Writes downloads.json on the `badges` branch for the README's downloads badge (shields.io endpoint). It counts only
# the setup people download (Halation_x64-setup.exe, and Halation_<v>_x64-setup.exe of older releases): not the
# updater's copy, latest.json, the signatures or the model releases.
on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Count setup downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[].assets[] | select(.name | test("^Halation_([0-9][^_]*_)?x64-setup\\.exe$")) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          echo "Setup downloads: $count"
          mkdir badge
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"a3a8dc","labelColor":"0b0b0a"}\n' "$count" > badge/downloads.json

      - name: Publish to the badges branch
        working-directory: badge
        run: |
          git init -q -b badges
          git config user.name Sylphera
          git config user.email 233718609+Sylphera@users.noreply.github.com
          git add downloads.json
          git commit -q -m "Downloads badge"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
