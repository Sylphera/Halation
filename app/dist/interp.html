<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Interpolate</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="interp.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script>
</head>
<body>
<main class="work">
  <section class="monitor" data-i18n-aria-label="ip.video">
    <div class="viewer" id="viewer">
    <div class="bezel"><div class="stage" id="stage">
      <img id="still" alt="" hidden>
      <canvas id="orig" hidden></canvas>
      <canvas id="mask" hidden></canvas>
      <span class="tag" id="stillTag" hidden></span>
      <div class="pair" id="pair" hidden>
        <figure><video id="vBefore" playsinline preload="auto"></video><figcaption class="tag" id="tagBefore"></figcaption></figure>
        <figure><video id="vAfter" muted playsinline preload="auto"></video><figcaption class="tag" id="tagAfter"></figcaption></figure>
      </div>
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
        <span class="big" data-icon="gauge"></span>
        <b data-i18n="ip.empty.title"></b>
        <p data-i18n="ip.empty.note"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="linkBtn" data-icon="link"><span data-i18n="common.downloadLink"></span></button></div>
      </div>
    </div></div>
    <div class="transport" id="transport" hidden>
      <button class="btn sm" id="playBtn" data-icon="play" data-i18n-title="ip.play" disabled></button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" data-i18n-aria-label="ip.from">
      <output class="mono" id="scrubTime">0:00.0</output>
      <div class="tabs" role="radiogroup" id="speeds" data-i18n-aria-label="ip.speed">
        <button class="tab" role="radio" data-speed="1" aria-checked="true">1×</button>
        <button class="tab" role="radio" data-speed="0.5" aria-checked="false">0.5×</button>
        <button class="tab" role="radio" data-speed="0.25" aria-checked="false">0.25×</button>
      </div>
      <button class="btn icon" id="fsBtn" data-icon="maximize" aria-pressed="false" data-i18n-title="ip.maximize" data-i18n-aria-label="ip.maximize"></button>
    </div>
    </div>
    <div class="info" id="inputInfo" hidden><img id="inThumb" alt=""><div><b id="inName"></b><span id="inMeta"></span></div><span class="spacer"></span><button class="btn sm" id="changeBtn"><span data-i18n="ip.change"></span></button></div>
    <input type="file" id="vidIn" accept="video/*,.mp4,.mov,.mkv,.webm,.avi" hidden>
  </section>

  <aside class="rack">
    <section class="card engine" id="engine">
      <div class="card-h"><h2 data-i18n="ip.engine"></h2><span id="engineBadge"></span></div>
      <p class="note" id="engineNote"></p>
      <div class="row" id="installRow" hidden><button class="btn primary" id="installBtn" data-icon="hard-drive-download"><span data-i18n="ip.install"></span></button></div>
      <div class="prog" id="installProg" hidden><i id="installBar"></i></div>
      <p class="status" id="installStatus"></p>
    </section>

    <section class="card opts">
      <div><span class="lbl note" data-i18n="ip.mode"></span>
        <div class="tabs" role="radiogroup" id="modes" data-i18n-aria-label="ip.mode">
          <button class="tab" role="radio" data-mode="x2" aria-checked="true">×2</button>
          <button class="tab" role="radio" data-mode="x4" aria-checked="false">×4</button>
          <button class="tab" role="radio" data-mode="target" aria-checked="false" data-i18n="ip.target"></button>
        </div></div>
      <div class="f" id="fpsRow" hidden><span data-i18n="ip.fps"></span>
        <select id="fps"><option value="30">30</option><option value="48">48</option><option value="50">50</option><option value="60" selected>60</option><option value="90">90</option><option value="120">120</option><option value="144">144</option></select></div>
      <div><span class="lbl note" data-i18n="ip.quality"></span>
        <div class="tabs" role="radiogroup" id="qualities" data-i18n-aria-label="ip.quality">
          <button class="tab" role="radio" data-quality="std" aria-checked="true" data-i18n="ip.q.std"></button>
          <button class="tab" role="radio" data-quality="high" aria-checked="false" data-i18n="ip.q.high"></button>
        </div>
        <p class="note" id="qualityNote"></p></div>
      <p class="note mono" id="plan"></p>
      <div class="btnrow">
        <button class="btn" id="previewBtn" data-icon="eye" disabled><span data-i18n="ip.preview"></span></button>
        <button class="btn primary" id="runBtn" data-icon="sparkles" disabled><span data-i18n="ip.run"></span></button>
        <button class="btn" id="cancelBtn" hidden><span data-i18n="common.cancel"></span></button>
      </div>
      <div class="prog" id="prog" hidden><i id="bar"></i></div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="card keep" id="keepCard">
      <div class="card-h"><h2 data-i18n="ip.keep"></h2><span class="badge-ok" id="keepBadge" hidden data-i18n="ip.keepOn"></span></div>
      <p class="note" data-i18n="ip.keepNote"></p>
      <div class="f"><label for="brush" data-i18n="ip.brush"></label><input type="range" data-def="8" id="brush" min="1" max="30" step="1" value="8"><output for="brush">8 %</output></div>
      <div class="btnrow">
        <button class="btn" id="paintBtn" data-icon="paintbrush" aria-pressed="false" disabled><span data-i18n="ip.paint"></span></button>
        <button class="btn ghost" id="clearMask" data-icon="eraser" disabled><span data-i18n="ip.clearMask"></span></button>
      </div>
    </section>

    <section class="card" id="result" hidden>
      <div class="card-h"><h2 data-i18n="ip.result"></h2><span class="badge-ok" id="resultFps"></span></div>
      <p class="note mono" id="resultName"></p>
      <div class="btnrow">
        <button class="btn" id="sendBtn" data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
        <button class="btn ghost" id="reveal" data-icon="folder-open"><span data-i18n="common.reveal"></span></button>
      </div>
    </section>
  </aside>
</main>

<script src="interp.js"></script>
</body></html>
