<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upscale</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="upscale.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="imgops.js"></script><script src="compare.js"></script>
</head>
<body>
<div class="up-mode"><div class="tabs" role="tablist" data-i18n-aria-label="up.media">
  <button class="tab" id="imageTab" role="tab" data-media="image" aria-selected="true" aria-controls="imageView" data-i18n="up.image"></button>
  <button class="tab" id="videoTab" role="tab" data-media="video" aria-selected="false" aria-controls="videoView" data-i18n="up.video"></button>
</div></div>
<main class="work" id="imageView" role="tabpanel" aria-labelledby="imageTab">
  <section class="monitor" data-i18n-aria-label="up.image">
    <div class="bezel" id="viewer"><div class="stage" id="stage">
      <img id="preview" alt="" hidden>
      <span class="tag" id="which" hidden></span>
      <div class="cmp" id="cmp" hidden>
        <div class="layer before" id="cmpBefore"><img alt="" draggable="false"></div>
        <div class="layer after" id="cmpAfter"><img alt="" draggable="false"></div>
        <div class="div" id="cmpDiv" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" data-i18n-aria-label="up.cmpDivider"><span class="knob" data-icon="chevrons-left-right"></span></div>
        <span class="lbl b" data-i18n="up.before"></span><span class="lbl a" data-i18n="up.after"></span>
        <span class="zoom" id="cmpZoom"></span>
      </div>
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
        <span class="big" data-icon="image-up"></span>
        <b data-i18n="up.empty.title"></b>
        <p data-i18n="up.empty.note"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="linkBtn" data-icon="link"><span data-i18n="common.downloadLink"></span></button></div>
      </div>
      <div class="bubble fullscreen-controls" id="fullscreenControls"></div>
    </div></div>
    <div class="info" id="inputInfo" hidden><img id="inThumb" alt=""><div><b id="inName"></b><span id="inSize"></span></div><span class="spacer"></span><button class="btn sm" id="uncropBtn" hidden data-icon="x" data-i18n-title="up.uncropTip"><span data-i18n="up.uncrop"></span></button><button class="btn sm" id="cropBtn" data-icon="crop" data-i18n-title="up.cropTip"><span data-i18n="up.crop"></span></button><button class="btn sm" id="changeBtn"><span data-i18n="up.change"></span></button><button class="btn ghost icon" id="fsBtn" data-icon="maximize" aria-pressed="false" data-i18n-title="up.maximize" data-i18n-aria-label="up.maximize"></button></div>
    <input type="file" id="imgIn" accept="image/png,image/jpeg,image/webp" multiple hidden>
  </section>

  <aside class="rack">
    <section class="card engine" id="engine">
      <div class="card-h"><h2 data-i18n="up.engine"></h2><span id="engineBadge"></span></div>
      <p class="note" id="engineNote"></p>
      <div class="row" id="installRow" hidden><button class="btn primary" id="installBtn" data-icon="hard-drive-download"><span data-i18n="up.install"></span></button></div>
      <div class="prog" id="installProg" hidden><i id="installBar"></i></div>
      <p class="status" id="installStatus"></p>
    </section>

    <section class="card opts">
      <div><span class="lbl note" data-i18n="up.scale"></span>
        <div class="tabs" role="radiogroup" data-i18n-aria-label="up.scale">
          <button class="tab" role="radio" data-scale="2" aria-checked="false">×2</button>
          <button class="tab" role="radio" data-scale="4" aria-checked="true">×4</button>
        </div></div>
      <div><span class="lbl note" data-i18n="up.type"></span>
        <div class="radios" id="models">
          <label class="radio"><input type="radio" name="model" value="photo" checked><span><b data-i18n="up.model.photo"></b><small data-i18n="up.model.photoNote"></small></span></label>
          <label class="radio"><input type="radio" name="model" value="art"><span><b data-i18n="up.model.art"></b><small data-i18n="up.model.artNote"></small></span></label>
          <label class="radio"><input type="radio" name="model" value="sharp"><span><b data-i18n="up.model.sharp"></b><small data-i18n="up.model.sharpNote"></small><small class="lic" data-i18n="up.model.sharpLicense"></small></span></label>
          <label class="radio"><input type="radio" name="model" value="fast"><span><b data-i18n="up.model.fast"></b><small data-i18n="up.model.fastNote"></small></span></label>
        </div></div>
      <div><span class="lbl note" data-i18n="up.format"></span>
        <div class="tabs" role="radiogroup" data-i18n-aria-label="up.format">
          <button class="tab" role="radio" data-format="png" aria-checked="true">PNG</button>
          <button class="tab" role="radio" data-format="jpg" aria-checked="false">JPG</button>
        </div></div>
      <label class="tog" for="chainCut"><span data-i18n="up.chainCut"></span><input type="checkbox" id="chainCut"></label>
      <div class="btnrow"><button class="btn primary" id="runBtn" data-icon="sparkles" disabled><span data-i18n="up.run"></span></button><button class="btn" id="cancelBtn" hidden><span data-i18n="common.cancel"></span></button></div>
      <div class="prog" id="prog" hidden><i id="bar"></i></div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="card" id="result" hidden>
      <div class="card-h"><h2 data-i18n="up.result"></h2><span class="badge-ok" id="resultSize"></span></div>
      <p class="note mono" id="resultName"></p>
      <p class="hint" data-i18n="up.cmpHint"></p>
      <div class="btnrow">
        <button class="btn" id="sendBtn" data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
        <button class="btn ghost" id="reveal" data-icon="folder-open"><span data-i18n="common.reveal"></span></button>
      </div>
    </section>

    <section class="card" id="queueCard" hidden>
      <div class="card-h"><h2 data-i18n="up.q.title"></h2></div>
      <div class="done-list queue" id="queueList"></div>
      <p class="note" id="queueNote"></p>
      <div class="btnrow"><button class="btn primary" id="queueRun" data-icon="play"><span data-i18n="up.q.run"></span></button><button class="btn" id="queueClear"><span data-i18n="up.q.clear"></span></button></div>
    </section>

    <section class="card" id="doneCard" hidden>
      <h2 data-i18n="up.finished"></h2>
      <div class="done-list" id="doneList"></div>
    </section>
  </aside>
</main>

<main class="work" id="videoView" role="tabpanel" aria-labelledby="videoTab" hidden>
  <section class="monitor">
    <div class="viewer" id="videoViewer"><div class="bezel"><div class="stage">
      <canvas id="videoCanvas" hidden></canvas>
      <div class="pair" id="videoPair" hidden>
        <figure><video id="videoBefore" muted playsinline preload="auto"></video><figcaption class="tag" data-i18n="up.before"></figcaption></figure>
        <figure><video id="videoAfter" muted playsinline preload="auto"></video><figcaption class="tag" data-i18n="up.after"></figcaption></figure>
      </div>
      <div class="emptyzone stage-empty" id="videoEmpty" role="button" tabindex="0">
        <span class="big" data-icon="film"></span><b data-i18n="up.v.empty"></b><p data-i18n="up.v.emptyNote"></p>
        <div class="btnrow"><button class="btn primary" id="videoBrowse" data-icon="upload"><span data-i18n="common.browse"></span></button></div>
      </div>
      <span class="tag" id="videoWhich" hidden></span>
      <div class="bubble fullscreen-controls" id="videoFullscreenControls"></div>
    </div></div>
    <div class="transport" id="videoTransport" hidden>
      <button class="btn sm" id="videoPlay" data-icon="play" data-i18n-aria-label="ip.play"></button>
      <input type="range" id="videoSeek" min="0" max="1000" value="0" data-i18n-aria-label="up.v.seek">
      <output class="mono" id="videoTime">0:00</output>
      <div class="tabs" role="radiogroup" data-i18n-aria-label="ip.speed">
        <button class="tab" role="radio" data-video-speed="1" aria-checked="true">1×</button>
        <button class="tab" role="radio" data-video-speed="0.5" aria-checked="false">0.5×</button>
        <button class="tab" role="radio" data-video-speed="0.25" aria-checked="false">0.25×</button>
      </div>
      <button class="btn sm" id="videoPreviewClose" hidden data-icon="x" data-i18n="common.close"></button>
      <button class="btn icon" id="videoFullscreen" data-icon="maximize" aria-pressed="false" data-i18n-title="up.maximize" data-i18n-aria-label="up.maximize"></button>
    </div>
    </div>
    <div class="info" id="videoInfo" hidden><img id="videoThumb" alt=""><div><b id="videoName"></b><span id="videoMeta"></span></div><span class="spacer"></span><button class="btn sm" id="videoChange" data-i18n="up.change"></button></div>
    <input type="file" id="videoIn" accept="video/*,.mp4,.mov,.mkv,.webm,.avi,.m4v" hidden>
  </section>
  <aside class="rack">
    <section class="card engine"><div class="card-h"><h2 data-i18n="up.engine"></h2><span id="videoEngineBadge"></span></div><p class="note" id="videoEngineNote"></p></section>
    <section class="card opts">
      <div><span class="lbl note" data-i18n="up.scale"></span><div class="tabs" role="radiogroup" data-i18n-aria-label="up.scale">
        <button class="tab" role="radio" data-video-scale="2" aria-checked="true">×2</button><button class="tab" role="radio" data-video-scale="4" aria-checked="false">×4</button>
      </div></div>
      <div><span class="lbl note" data-i18n="up.v.output"></span><p class="note mono" id="videoPlan" data-i18n="up.v.planEmpty"></p><p class="note" data-i18n="up.v.outputNote"></p></div>
      <div class="btnrow"><button class="btn" id="videoPreviewBtn" disabled data-icon="eye"><span data-i18n="ip.preview"></span></button><button class="btn primary" id="videoRun" disabled data-icon="sparkles"><span data-i18n="up.run"></span></button><button class="btn" id="videoCancel" hidden data-i18n="common.cancel"></button></div>
      <div class="prog" id="videoProg" hidden><i id="videoBar"></i></div><p class="status" id="videoStatus" role="status"></p>
    </section>
    <section class="card" id="videoResult" hidden><div class="card-h"><h2 data-i18n="up.result"></h2><span class="badge-ok" id="videoResultSize"></span></div><p class="note mono" id="videoResultName"></p>
      <div class="btnrow"><button class="btn" id="videoOriginal" data-i18n="up.original"></button><button class="btn" id="videoShowResult" data-i18n="up.result"></button><button class="btn" id="videoSend" data-icon="send"><span data-i18n="send.to"></span></button><button class="btn ghost" id="videoReveal" data-icon="folder-open"><span data-i18n="common.reveal"></span></button></div>
    </section>
  </aside>
</main>
<script src="upscale.js"></script>
</body></html>
