[package]
name = "halation-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Halation's logic without a user interface: jobs, processes, Library, settings, presets"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico", "tga", "qoi"] }
webp = { version = "=0.3.1", default-features = false }
tiff = "=0.11.3"
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
