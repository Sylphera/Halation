name: CI

on:
  push:
    branches: ["slint/**"]
  pull_request:
    branches: ["slint/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Developer workflow self-tests
        run: python tools/test_dev.py
      - name: Developer checkout diagnostics
        run: python tools/dev.py doctor
      - name: Architecture and agent contract self-tests
        run: python tools/test_structure.py
      - name: Repository architecture and feature-index gates
        run: python tools/check-structure.py
      - name: Documentation links and Status lines
        run: python tools/check-docs.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Provision FFmpeg for media integration tests
        shell: pwsh
        run: |
          # This versioned Chocolatey package includes both ffmpeg.exe and ffprobe.exe.
          # Keep CI independent of the developer's Halation profile and runner PATH.
          choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey FFmpeg installation failed ($LASTEXITCODE)" }
          $packageTools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem -LiteralPath $packageTools -Filter ffmpeg.exe -File -Recurse |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.DirectoryName 'ffprobe.exe') } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe and ffprobe.exe not found together under $packageTools" }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg.exe -version failed' }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe.exe -version failed' }
          "HALATION_FFMPEG=$($ffmpeg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Tests
        run: cargo test --workspace --locked
      - name: Runtime renderers (winit + Skia only)
        shell: bash
        run: |
          if cargo tree -e features -p halation-app --locked | grep -iE "renderer-software|femtovg|i-slint-backend-qt"; then
            echo "::error::a renderer other than Skia is in the runtime graph"; exit 1
          fi
      - name: halation-core does not depend on Slint
        shell: bash
        run: |
          if cargo tree -p halation-core --locked -e normal | grep -E "^.*(slint|tauri)"; then
            echo "::error::halation-core depends on Slint or Tauri"; exit 1
          fi
