<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style><script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="imgops.js"></script><script src="shim.js"></script><script src="fontpicker.js"></script></head><body>
<title>Audio Visualizer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="visualizer.css">

<div id="sync" data-s="none" hidden><span id="syncText"></span></div>

<main class="work">
  <section class="monitor" data-i18n-aria-label="vis.preview">
    <div class="player" id="player">
    <div class="bezel">
      <div class="stage" id="stage">
        <canvas id="pv" data-i18n-aria-label="vis.previewVideo"></canvas>
        <div class="badge" id="fmtBadge">1920×1080 · 30 fps</div>
        <div class="rec-tag" id="recTag" hidden data-i18n="vis.frozen"></div>
        <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
          <span class="big" data-icon="audio-lines" aria-hidden="true"></span>
          <b data-i18n="vis.empty.title"></b>
          <p data-i18n="vis.empty.note"></p>
          <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="linkBtn" data-icon="link"><span data-i18n="common.downloadLink"></span></button></div>
        </div>
      </div>
    </div>
    <div class="transport">
      <button class="play" id="play" data-icon="play" data-i18n-aria-label="vis.play"></button>
      <div class="scrub" id="scrub" data-i18n-title="vis.scrub"><canvas id="strip" aria-hidden="true"></canvas><input type="range" id="seek" min="0" max="1" step="0.01" value="0" data-i18n-aria-label="vis.position"><button class="mark" id="markIn" hidden data-i18n-aria-label="vis.markIn" data-i18n-title="vis.markInTip"></button><button class="mark" id="markOut" hidden data-i18n-aria-label="vis.markOut" data-i18n-title="vis.markOutTip"></button><span class="hover-time" id="hoverTime" hidden></span></div>
      <span class="time" id="time">0:00.0 / 0:00.0</span>
      <div class="tools">
        <label class="vol" data-icon="volume-2" data-i18n-title="vis.volumeTip"><input type="range" data-def="0.8" id="vol" min="0" max="1" step="0.01" value="0.8" data-i18n-aria-label="vis.volume"></label>
        <button class="play fs" id="fsBtn" data-icon="maximize" data-i18n-aria-label="vis.fullscreen" data-i18n-title="vis.fullscreenTip"></button>
      </div>
    </div>
    <div class="meter"><span data-i18n="vis.bass"></span><div class="bar"><i id="meter"></i></div><b id="meterHz">≤ 110 Hz</b></div>
    </div>
    <div class="sources">
      <label class="src" for="artIn">
        <img class="thumb" id="artThumb" alt="">
        <div><b data-i18n="vis.cover"></b><span id="artName" data-i18n="vis.noCover"></span></div>
        <input type="file" id="artIn" accept="image/*" hidden>
      </label>
      <label class="src" for="audIn">
        <span class="ico" data-icon="audio-lines"></span>
        <div><b data-i18n="vis.audio"></b><span id="audName" data-i18n="vis.noAudio"></span></div>
        <input type="file" id="audIn" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg" hidden>
      </label>
      <div class="btnrow" id="shellRow" hidden><button class="btn" id="artLibBtn" data-icon="library" data-i18n-title="vis.fromLibraryTip"><span data-i18n="vis.fromLibrary"></span></button><button class="btn" id="artCropBtn" data-icon="crop" data-i18n-title="vis.cropTip"><span data-i18n="vis.crop"></span></button><button class="btn" id="artCutBtn" data-icon="scissors" data-i18n-title="vis.cutTip"><span data-i18n="vis.cut"></span></button><button class="btn" id="sendCoverBtn" data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button></div>
    </div>
    <div class="outrow">
      <section class="card" id="outCard" data-i18n-aria-label="vis.g.out">
        <div class="card-h"><h2 data-i18n="vis.g.out"></h2><button class="btn sm ghost" id="useDefault" type="button" data-i18n-title="vis.useDefaultTip" hidden><span data-i18n="common.useDefault"></span></button></div>
        <div class="outgrid" id="outFields"></div>
      </section>
      <section class="card export" data-i18n-aria-label="vis.export">
        <h2 data-i18n="vis.export"></h2>
        <div class="spec" id="spec"></div>
        <div class="btnrow">
          <button class="btn primary" id="exportBtn" data-i18n="vis.exportOpen" aria-haspopup="dialog"></button>
          <button class="btn" id="cancelBtn" hidden data-i18n="common.cancel"></button>
          <button class="btn" id="saveAgain" hidden data-i18n="common.reveal"></button>
          <button class="btn" id="sendVideoBtn" hidden data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
        </div>
        <div class="prog" id="prog" hidden><i id="progBar"></i></div>
        <p class="status" id="status" data-i18n="vis.st.loadAudio"></p>
      </section>
    </div>
  </section>

  <aside class="rack" data-i18n-aria-label="vis.settings">
    <div id="groups"></div>

    <details class="sec" id="queueSec" hidden>
      <summary><span class="l"><span data-i18n="vis.queue"></span><span class="qcount" id="queueCount"></span></span></summary>
      <div class="fields">
        <p class="note" data-i18n="vis.queueNote"></p>
        <div class="list" id="queueList"></div>
        <div class="btnrow"><label class="btn" for="queueAudio" data-i18n="vis.queueAdd"></label><button class="btn primary" id="queueRun" disabled data-i18n="vis.queueRun"></button><button class="btn" id="queueCancel" hidden data-i18n="common.cancel"></button><button class="btn" id="queueClear" hidden data-i18n="common.clear"></button></div>
        <input type="file" id="queueAudio" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg" multiple hidden>
        <input type="file" id="queueCover" accept="image/*" hidden>
        <p class="status" id="queueStatus"></p>
      </div>
    </details>

    <details class="sec">
      <summary><span class="l" data-i18n="vis.saved"></span></summary>
      <div class="fields">
        <p class="note" data-i18n="vis.savedNote"></p>
        <div class="f">
          <div class="fl"><label for="presetName" data-i18n="vis.presetSaveLabel"></label></div>
          <div class="colorrow"><input type="text" id="presetName" data-i18n-placeholder="vis.presetPlaceholder" maxlength="60"><button class="btn" id="presetSave" data-i18n="common.save"></button></div>
        </div>
        <div class="list" id="presetList"></div>
        <div class="btnrow">
          <button class="btn" id="exportJson" data-i18n="vis.exportJson"></button>
          <label class="btn" for="importJson" data-i18n="vis.importJson"></label>
          <input type="file" id="importJson" accept=".json,application/json" hidden>
          <button class="btn warn" id="resetAll" data-i18n="vis.resetAll"></button>
        </div>
      </div>
    </details>
  </aside>
</main>

<dialog class="modal xdlg" id="xDialog" data-i18n-aria-label="vis.x.title">
  <form method="dialog">
    <h2 data-i18n="vis.x.title"></h2>
    <div class="tabs" role="radiogroup" id="xMode" data-i18n-aria-label="vis.x.mode">
      <button type="button" class="tab" role="radio" data-mode="single" data-i18n="vis.x.single"></button>
      <button type="button" class="tab" role="radio" data-mode="layers" data-i18n="vis.x.layers"></button>
    </div>
    <div id="xSingle">
      <p class="note" data-i18n="vis.x.singleNote"></p>
      <div class="spec" id="xSpec"></div>
      <details class="adv" id="xAdv"><summary data-i18n="set.advanced"></summary>
        <div class="row2">
          <label class="f"><span data-i18n="set.videoCodec"></span><select id="xVcodec"><option value="auto" data-i18n="set.codec.auto"></option><option value="h264" data-i18n="set.codec.h264"></option><option value="vp9" data-i18n="set.codec.vp9"></option></select></label>
          <label class="f"><span data-i18n="set.audioCodec"></span><select id="xAcodec"><option value="auto" data-i18n="set.codec.auto"></option><option value="aac" data-i18n="set.codec.aac"></option><option value="opus" data-i18n="set.codec.opus"></option></select></label>
        </div>
      </details>
    </div>
    <div class="xcol" id="xLayers" hidden>
      <p class="note" data-i18n="vis.x.layersNote"></p>
      <div class="xgrid">
        <fieldset class="xset"><legend data-i18n="vis.x.which"></legend>
          <label class="xchk"><input type="checkbox" id="xWbg"><span><b data-i18n="vis.x.l.bg"></b><small data-i18n="vis.x.l.bgNote"></small></span></label>
          <label class="xchk"><input type="checkbox" id="xWcover"><span><b data-i18n="vis.x.l.cover"></b><small data-i18n="vis.x.l.coverNote"></small></span></label>
          <label class="xchk"><input type="checkbox" id="xWtext"><span><b data-i18n="vis.x.l.text"></b><small id="xTextNote" data-i18n="vis.x.l.textNote"></small></span></label>
          <label class="xchk"><input type="checkbox" id="xWfinish"><span><b data-i18n="vis.x.l.finish"></b><small id="xFinishNote"></small></span></label>
        </fieldset>
        <div class="xcol">
          <label class="f"><span data-i18n="vis.x.format"></span><select id="xFormat"><option value="prores4444" data-i18n="vis.x.f.prores"></option><option value="webm" data-i18n="vis.x.f.webm"></option><option value="png" data-i18n="vis.x.f.png"></option></select></label>
          <p class="hint" data-i18n="vis.x.bgAlways"></p>
          <fieldset class="xset"><legend data-i18n="vis.x.finish"></legend>
            <div class="radios">
              <label class="radio"><input type="radio" name="xFinish" value="baked"><span><b data-i18n="vis.x.baked"></b><small data-i18n="vis.x.bakedNote"></small></span></label>
              <label class="radio"><input type="radio" name="xFinish" value="overlay"><span><b data-i18n="vis.x.overlay"></b><small data-i18n="vis.x.overlayNote"></small></span></label>
            </div>
          </fieldset>
          <fieldset class="xset"><legend data-i18n="vis.x.extras"></legend>
            <label class="xchk"><input type="checkbox" id="xAudio"><span><b data-i18n="vis.x.audio"></b><small data-i18n="vis.x.audioNote"></small></span></label>
            <label class="xchk"><input type="checkbox" id="xEnv"><span><b data-i18n="vis.x.env"></b><small data-i18n="vis.x.envNote"></small></span></label>
          </fieldset>
        </div>
      </div>
      <div class="xfiles" id="xFiles"></div>
      <p class="status" id="xSpace"></p>
      <div class="xff" id="xFf" hidden>
        <p class="note" data-i18n="vis.x.ffNeeded"></p>
        <div class="btnrow"><button type="button" class="btn" id="xFfGet" data-icon="hard-drive-download"><span data-i18n="vis.x.ffGet"></span></button></div>
        <div class="prog" id="xFfProg" hidden><i id="xFfBar"></i></div>
        <p class="status" id="xFfStatus"></p>
      </div>
    </div>
    <div class="macts"><button class="btn" value="cancel" formnovalidate data-i18n="common.cancel"></button><button class="btn primary" id="xGo" value="go" data-i18n="vis.x.go"></button></div>
  </form>
</dialog>

<input type="file" id="anyIn" accept="audio/*,image/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus" multiple hidden>
<input type="file" id="fontIn" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
<input type="file" id="logoIn" accept="image/png,image/webp,image/jpeg,image/svg+xml,image/gif" hidden>

<script type="module" src="visualizer.js"></script>

</body></html>
