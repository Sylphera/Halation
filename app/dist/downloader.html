<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Downloader</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="downloader.css">
<script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="spotify.js"></script>
</head>
<body>
<div class="wrap">
  <section class="card terms" id="terms" hidden>
    <div class="card-h"><h2 data-i18n="dl.terms.title"></h2></div>
    <p class="note" data-i18n="dl.terms.body"></p>
    <div class="row"><button class="btn primary" type="button" id="termsOk"><span data-i18n="dl.terms.ok"></span></button></div>
  </section>
  <section class="card engine" id="engine" hidden>
    <div class="card-h"><h2 data-i18n="dl.engine"></h2><span class="badge-warn" data-i18n="dl.engineMissing"></span></div>
    <p class="note" data-i18n="dl.engineNote"></p>
    <div class="row"><button class="btn primary" id="installBtn" data-icon="hard-drive-download"><span data-i18n="dl.install"></span></button></div>
    <div class="prog" id="installProg" hidden><i id="installBar"></i></div>
    <p class="status" id="installStatus"></p>
  </section>

  <form class="linkbar" id="linkForm" autocomplete="off">
    <div class="field"><span data-icon="link"></span><input type="url" id="url" data-i18n-placeholder="dl.paste" data-i18n-aria-label="dl.link" spellcheck="false"></div>
    <button class="btn" type="button" id="pasteBtn" data-icon="clipboard-paste" data-i18n-title="dl.pasteTip"><span data-i18n="dl.pasteBtn"></span></button>
    <button class="btn primary" type="submit" id="goBtn" data-icon="search"><span data-i18n="dl.go"></span></button>
  </form>
  <p class="status" id="status" role="status"></p>

  <section class="card" id="album" hidden>
    <div class="preview">
      <img class="thumb" id="aCover" alt="">
      <div class="meta">
        <h2 id="aTitle"></h2>
        <p class="note" id="aAuthor"></p>
        <div class="chipsrow" id="aChips"></div>
        <p class="notice badge-info" id="aNotice" hidden></p>
      </div>
    </div>
    <div class="albumbar">
      <label class="selall"><input type="checkbox" id="selAll"><span data-i18n="dl.album.selectAll"></span></label>
      <span class="note" id="selCount"></span>
    </div>
    <div class="tracks" id="tracks" role="list" data-i18n-aria-label="dl.album.songs"></div>
    <div class="batch">
      <div class="tabs" id="bKind" role="radiogroup" data-i18n-aria-label="dl.album.as">
        <button class="tab" type="button" role="radio" data-k="audio" aria-checked="true" data-i18n="dl.audio"></button>
        <button class="tab" type="button" role="radio" data-k="video" aria-checked="false" data-i18n="dl.video"></button>
        <button class="tab" type="button" role="radio" data-k="cover" aria-checked="false" data-i18n="dl.cover"></button>
      </div>
      <select id="bAudio" data-i18n-aria-label="dl.audio"><option value="original" data-i18n="dl.original"></option><option value="mp3" data-i18n="dl.mp3"></option></select>
      <select id="bQuality" data-i18n-aria-label="dl.quality" hidden><option value="0" data-i18n="dl.best"></option><option value="2160">2160p</option><option value="1440">1440p</option><option value="1080" selected>1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select>
      <span class="grow"></span>
      <button class="btn primary" type="button" id="addSel" data-icon="list-plus"><span class="lbl"></span></button>
    </div>
  </section>

  <section class="card" id="preview" hidden>
    <button class="btn sm ghost back" type="button" id="backAlbum" data-icon="arrow-left" hidden><span data-i18n="dl.album.back"></span></button>
    <div class="preview">
      <img class="thumb" id="pThumb" alt="">
      <div class="meta">
        <h2 id="pTitle"></h2>
        <p class="note" id="pAuthor"></p>
        <div class="chipsrow" id="pChips"></div>
        <p class="notice badge-info" id="pNotice" hidden></p>
      </div>
    </div>
    <div class="sources" id="pSources" hidden>
      <h3><span data-icon="search"></span><span data-i18n="dl.sp.source"></span></h3>
      <p class="note" id="srcNote" role="status"></p>
      <div class="srclist" id="srcList" role="radiogroup" data-i18n-aria-label="dl.sp.source"></div>
    </div>
    <div class="choices">
      <div class="choice" id="cVideo">
        <h3><span data-icon="film"></span><span data-i18n="dl.video"></span></h3>
        <label class="f"><span data-i18n="dl.quality"></span><select id="quality"></select></label>
        <p class="hint" data-i18n="dl.videoNote"></p>
        <span class="grow"></span>
        <button class="btn primary" id="getVideo" data-icon="download"><span data-i18n="dl.getVideo"></span></button>
      </div>
      <div class="choice" id="cAudio">
        <h3><span data-icon="music"></span><span data-i18n="dl.audio"></span></h3>
        <label class="opt"><input type="radio" name="afmt" value="original" checked><span><span data-i18n="dl.original"></span><small data-i18n="dl.originalNote"></small></span></label>
        <label class="opt"><input type="radio" name="afmt" value="mp3"><span><span data-i18n="dl.mp3"></span><small data-i18n="dl.mp3Note"></small></span></label>
        <span class="grow"></span>
        <button class="btn primary" id="getAudio" data-icon="download"><span data-i18n="dl.getAudio"></span></button>
      </div>
      <div class="choice" id="cCover">
        <h3><span data-icon="image"></span><span data-i18n="dl.cover"></span></h3>
        <p class="note" id="coverNote" data-i18n="dl.coverNote"></p>
        <span class="grow"></span>
        <button class="btn primary" id="getCover" data-icon="download"><span data-i18n="dl.getCover"></span></button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2><span data-i18n="dl.queue"></span> <span class="n" id="qCount"></span></h2>
      <div class="acts"><button class="btn sm ghost" id="openDownloads" data-icon="folder-open"><span data-i18n="common.openFolder"></span></button><button class="btn sm ghost" id="clearDone" hidden><span data-i18n="dl.clearDone"></span></button></div></div>
    <div class="queue" id="queue"></div>
    <p class="empty" id="qEmpty" data-i18n="dl.queueEmpty"></p>
  </section>
  <p class="fine" id="termsLine"><span data-i18n="dl.terms.line"></span> <span data-i18n="dl.terms.brands"></span></p>
</div>

<script src="downloader.js"></script>
</body></html>
