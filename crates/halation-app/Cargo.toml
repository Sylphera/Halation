[package]
name = "halation-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Halation: the native app (lifecycle, Slint interface, navigation, controllers)"
build = "build.rs"

[lib]
name = "halation_app"
path = "src/lib.rs"

[[bin]]
name = "halation-slint"
path = "src/main.rs"

[dependencies]
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    # Inter is registered at run time from the assets folder (pinned Slint version)
    "unstable-fontique-011",
] }

[target.'cfg(windows)'.dependencies]
# Media Foundation (Windows' own H.264 decoder) for Home's backdrop loop; already in the tree through winit
windows = { version = "=0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
# Diagnostic renderer comparison only; the shipping beta uses winit + Skia.
diag-femtovg = ["slint/renderer-femtovg"]
diag-software = ["slint/renderer-software"]
# Headless page snapshots (`--screenshot`) through the software renderer; never part of the shipping build.
diag-screenshot = ["slint/renderer-software"]
diag-skia-opengl = ["slint/renderer-skia-opengl"]
diag-skia-vulkan = ["slint/renderer-skia-vulkan"]

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
# Headless UI tests (layout bounds at small window sizes); test builds only, never part of the shipped binary.
i-slint-backend-testing = "=1.18.1"
