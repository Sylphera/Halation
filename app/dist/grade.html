<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style><script src="i18n.js"></script><script src="common.js"></script><script src="icons.js"></script><script src="gsap.min.js"></script><script src="Flip.min.js"></script><script src="motion.js"></script><script src="imgops.js"></script><script src="shim.js"></script><script src="fontpicker.js"></script></head><body>
<title>Grade</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="grade.css">

<div id="sync" data-s="none" hidden><span id="syncText"></span></div>

<main class="work">
  <aside class="lib" data-i18n-aria-label="grade.library">
    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="filters" data-i18n="grade.filters"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="tools" data-i18n="grade.tools"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="mine" data-i18n="grade.mine"></button>
      </div>
      <div class="pane" id="pane-filters">
        <div class="f"><div class="fl"><label for="thumbPct" data-i18n="grade.thumbPct"></label><output id="oThumbPct">100 %</output></div><input type="range" data-def="100" id="thumbPct" min="5" max="100" step="5" value="100"><span class="hint" data-i18n="grade.thumbHint"></span></div>
        <div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
      <div class="pane" id="pane-tools" hidden></div>
      <div class="pane" id="pane-mine" hidden>
        <div class="f"><div class="fl"><label for="lookName" data-i18n="grade.lookSaveLabel"></label></div>
          <div class="colorrow"><input type="text" id="lookName" maxlength="60" data-i18n-placeholder="grade.lookPlaceholder"><button class="btn" id="lookSave" data-i18n="common.save"></button></div></div>
        <div class="list" id="lookList"></div>
        <section class="batch" id="batchCard" data-i18n-aria-label="grade.batch">
          <div class="card-h"><h2><span data-i18n="grade.batch"></span> <span class="n" id="batchCount"></span></h2><button class="btn sm" id="batchClear" hidden data-i18n="common.clear"></button></div>
          <p class="blist" id="batchList" data-i18n="grade.batchNoteExport"></p>
          <div class="row">
            <div class="btnrow"><label class="btn sm" for="batchFiles" data-i18n="grade.batchFiles"></label><label class="btn sm" for="batchDir" data-i18n="grade.batchDir"></label></div>
            <div class="f"><div class="fl"><label for="batchLook" data-i18n="common.apply"></label></div><select id="batchLook"></select></div>
          </div>
          <input type="file" id="batchFiles" accept="image/*" multiple hidden>
          <input type="file" id="batchDir" webkitdirectory multiple hidden>
          <div class="btnrow"><button class="btn primary" id="batchRun" disabled data-i18n="grade.batchRun"></button><button class="btn" id="batchCancel" hidden data-i18n="common.cancel"></button></div>
          <div class="prog" id="batchProg" hidden><i id="batchBar"></i></div>
          <p class="status" id="batchStatus"></p>
        </section>
      </div>
    </section>
  </aside>

  <section class="center" data-i18n-aria-label="grade.image">
    <div class="toolbar">
      <button class="btn" id="undoBtn" data-icon="undo-2" data-i18n-title="grade.undoTip"><span data-i18n="grade.undo"></span></button>
      <button class="btn" id="redoBtn" data-icon="redo-2" data-i18n-title="grade.redoTip"><span data-i18n="grade.redo"></span></button>
      <button class="btn" id="origBtn" data-icon="eye" data-i18n-title="grade.origTip"><span data-i18n="grade.original"></span></button>
      <span class="sep"></span>
      <label class="src" for="imgIn" data-i18n-title="grade.changeImage"><img id="thumb" alt=""><div><b data-i18n="grade.image"></b><span id="imgName" data-i18n="grade.noImage"></span></div><input type="file" id="imgIn" accept="image/*" hidden></label>
      <button class="btn ghost icon" id="frameTool" data-icon="camera" data-i18n-title="grade.fromVideoTip" data-i18n-aria-label="grade.fromVideoTip"></button>
      <button class="btn ghost icon" id="fsBtn" data-icon="maximize" aria-pressed="false" data-i18n-title="grade.maximize" data-i18n-aria-label="grade.maximize"></button>
    </div>
    <div class="bezel" id="bezel"><div class="stage" id="stage"><canvas id="gl"></canvas>
      <div class="emptyzone stage-empty" id="emptyStage" role="button" tabindex="0">
        <span class="big" data-icon="image-plus"></span>
        <b data-i18n="grade.empty.title"></b>
        <p data-i18n="grade.empty.note"></p>
        <div class="btnrow"><button class="btn primary" id="browseBtn" data-icon="upload"><span data-i18n="common.browse"></span></button><button class="btn" id="linkBtn" data-icon="link"><span data-i18n="common.downloadLink"></span></button><button class="btn" id="frameBtn" data-icon="camera"><span data-i18n="grade.fromVideo"></span></button></div>
      </div><div class="tag orig" id="origTag" hidden data-i18n="grade.original"></div><div class="tag draft" id="draftTag" hidden></div>
      <div class="bubble fullscreen-controls" id="fullscreenControls"></div>
    </div></div>
    <div class="card export" data-i18n-aria-label="grade.export">
      <div class="f"><div class="fl"><label for="aspect" data-i18n="grade.format"></label></div><select id="aspect">
        <option value="orig" data-i18n="grade.ar.orig"></option><option value="1" data-i18n="grade.ar.1"></option><option value="0.8" data-i18n="grade.ar.0.8"></option><option value="0.5625" data-i18n="grade.ar.0.5625"></option><option value="1.7778" data-i18n="grade.ar.1.7778"></option>
      </select></div>
      <div class="f"><div class="fl"><label for="outSize" data-i18n="grade.outSize"></label></div><select id="outSize"><option value="orig" data-i18n="grade.size.orig"></option><option value="3000" selected data-i18n="grade.size.3000"></option><option value="2048" data-i18n="grade.size.2048"></option><option value="1080" data-i18n="grade.size.1080"></option></select></div>
      <div class="f"><div class="fl"><label for="outFmt" data-i18n="grade.outFmt"></label></div><select id="outFmt"><option value="png" data-i18n="grade.fmt.png"></option><option value="jpg" data-i18n="grade.fmt.jpg"></option></select></div>
      <button class="btn sm ghost usedef" id="useDefault" type="button" data-i18n-title="grade.useDefaultTip" hidden><span data-i18n="common.useDefault"></span></button>
      <button class="btn primary" id="exportBtn" data-icon="save"><span data-i18n="grade.export"></span></button>
      <div class="framing" id="framing">
        <button class="btn sm" id="cropBtn" data-icon="crop" data-i18n-title="grade.cropTip"><span data-i18n="grade.cropEdit"></span></button>
        <button class="btn sm" id="cutBtn" hidden data-icon="scissors" data-i18n-title="grade.cutTip"><span data-i18n="grade.cut"></span></button>
        <button class="btn sm" id="cutOff" hidden data-icon="x"><span data-i18n="grade.cutOff"></span></button>
        <span class="cropout" id="cropOut"></span>
      </div>
      <div class="acts">
        <button class="btn" id="sendBtn" hidden data-icon="send" data-i18n-title="send.tip"><span data-i18n="send.to"></span></button>
        <p class="status" id="status" data-i18n="grade.st.start"></p>
        <button class="btn sm" id="revealBtn" hidden data-i18n="common.reveal"></button>
      </div>
    </div>
  </section>

  <aside class="rack" data-i18n-aria-label="grade.editing">
    <section class="card">
      <div class="lhead"><h2 data-i18n="grade.layers"></h2><button class="btn sm" id="saveLookBtn" data-icon="save"><span data-i18n="grade.saveLook"></span></button></div>
      <div class="ltabs" role="tablist">
        <button class="ltab" role="tab" aria-selected="true" data-ltab="F" aria-controls="listF"><span data-i18n="grade.filters"></span> <span class="n" id="cntF"></span></button>
        <button class="ltab" role="tab" aria-selected="false" data-ltab="E" aria-controls="listE"><span data-i18n="grade.effects"></span> <span class="n" id="cntE"></span></button>
      </div>
      <div class="ltools" id="ltools"><span class="sp" id="layerCount"></span><button class="btn sm ghost" id="selAllL" data-icon="check"><span data-i18n="common.selectAll"></span></button><button class="btn sm ghost" id="clearBtn" data-icon="trash-2"><span data-i18n="common.clear"></span></button></div>
      <div class="selbar" id="selbar" hidden><b id="selCount"></b><button class="btn sm icon" id="selHide" data-icon="eye-off" data-i18n-title="grade.sel.hide" data-i18n-aria-label="grade.sel.hide"></button><button class="btn sm icon" id="selShow" data-icon="eye" data-i18n-title="grade.sel.show" data-i18n-aria-label="grade.sel.show"></button><button class="btn sm ghost icon" id="selAllL2" data-icon="check" data-i18n-title="common.selectAll" data-i18n-aria-label="common.selectAll"></button><button class="btn sm warn" id="selDel" data-icon="trash-2"><span data-i18n="common.delete"></span></button><button class="ib" id="selNone" data-i18n-aria-label="grade.sel.none" data-i18n-title="grade.sel.none" data-icon="x"></button></div>
      <div id="layers">
        <div class="list layers" id="listF" role="list"></div>
        <div class="list layers" id="listE" role="list" hidden></div>
      </div>
      <p class="hint" data-i18n="grade.layersHint"></p>
    </section>
  </aside>
</main>
<div class="menu lmenu" id="lmenu" role="menu" hidden>
  <button role="menuitem" data-m="dup" data-icon="copy"><span data-i18n="grade.l.duplicate"></span></button>
  <button role="menuitem" data-m="top" data-icon="arrow-up"><span data-i18n="grade.l.toTop"></span></button>
  <button role="menuitem" data-m="bottom" data-icon="arrow-down"><span data-i18n="grade.l.toBottom"></span></button>
  <button role="menuitem" class="warn" data-m="del" data-icon="trash-2"><span data-i18n="common.delete"></span></button>
</div>

<script type="module" src="grade.js"></script>

</body></html>
